name: Keep Live Tiles Fresh

# GitHub's scheduler is best-effort and was skipping most "Update Live Tiles" runs (gaps of
# up to 6 hours). This workflow guarantees the cadence: it starts Update Live Tiles every
# 30 minutes for ~5.5 hours, then starts a fresh copy of itself (jobs are capped at 6 hours).
# The schedule below only restarts the chain if it ever breaks.

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"
      timezone: "Asia/Kolkata"

permissions:
  actions: write   # needed to start workflow_dispatch runs with GITHUB_TOKEN
  contents: read

# Only one keeper at a time; a restart that arrives while one is running just waits its turn
concurrency:
  group: keep-live-tiles
  cancel-in-progress: false

jobs:
  keep-live:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}

    steps:
      - name: Start Update Live Tiles every 30 minutes
        run: |
          for i in $(seq 1 11); do
            echo "[$(TZ=Asia/Kolkata date '+%d %b %H:%M IST')] Starting Update Live Tiles ($i/11)"
            gh workflow run tiles.yml --repo "$REPO" || echo "Start failed; trying again next cycle"
            if [ "$i" -lt 11 ]; then sleep 1800; fi
          done

      - name: Hand over to the next keeper
        # Not after a manual cancel, so the chain can be stopped from the Actions tab
        if: success() || failure()
        run: gh workflow run keep-live.yml --repo "$REPO"
