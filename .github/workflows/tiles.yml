name: Update Live Tiles

on:
  schedule:
    - cron: "*/5 * * * *"     # every 5 minutes (all tiles except weather)
    - cron: "0 * * * *"       # hourly (weather)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Ensure tiles folder
        run: mkdir -p tiles

      - name: Install Node dependencies
        run: npm install node-fetch@2

      # =========================
      # SYSTEM & ACTIVITY TILES
      # =========================

      - name: Commits tile
        run: |
          COMMITS=$(git log --since="7 days ago" --pretty=oneline | wc -l)
          BAR=$(printf "%0.s█" $(seq 1 $((COMMITS>0 ? (COMMITS/5+1) : 1))))
          cat > tiles/commits.svg << EOF
          <svg xmlns="http://www.w3.org/2000/svg" width="300" height="120"
               style="font-family:'Segoe UI','Segoe UI Variable',sans-serif">
            <rect width="300" height="120" fill="#0078D4"/>
            <text x="20" y="40" fill="white" font-size="20">COMMITS (WEEK)</text>
            <text x="20" y="75" fill="white" font-size="26">$BAR</text>
            <text x="20" y="105" fill="white" font-size="20">$COMMITS commits</text>
          </svg>
          EOF

      - name: Projects tile
        run: |
          PROJECTS=$(find . -maxdepth 1 -type d | wc -l)
          BAR=$(printf "%0.s█" $(seq 1 $((PROJECTS>0 ? PROJECTS : 1))))
          cat > tiles/projects.svg << EOF
          <svg xmlns="http://www.w3.org/2000/svg" width="300" height="120"
               style="font-family:'Segoe UI','Segoe UI Variable',sans-serif">
            <rect width="300" height="120" fill="#00B7C3"/>
            <text x="20" y="40" fill="white" font-size="20">PROJECTS ACTIVE</text>
            <text x="20" y="80" fill="white" font-size="26">$BAR $PROJECTS</text>
          </svg>
          EOF

      - name: LOC tile
        run: |
          STATS=$(git log --since="7 days ago" --numstat --pretty="%H" | awk 'NF==3 {add+=$1; del+=$2} END {print add,del}')
          ADDED=$(echo "$STATS" | awk '{print $1+0}')
          REMOVED=$(echo "$STATS" | awk '{print $2+0}')
          cat > tiles/loc.svg << EOF
          <svg xmlns="http://www.w3.org/2000/svg" width="300" height="140"
               style="font-family:'Segoe UI','Segoe UI Variable',sans-serif">
            <rect width="300" height="140" fill="#2B88D8"/>
            <g opacity="0">
              <text x="20" y="35" fill="white" font-size="18">LINES OF CODE (7 DAYS)</text>
              <text x="20" y="70" fill="white" font-size="16">+ $ADDED added</text>
              <text x="20" y="100" fill="white" font-size="16">- $REMOVED removed</text>
              <animate attributeName="opacity" from="0" to="1" dur="1.2s" repeatCount="1" fill="freeze"/>
            </g>
          </svg>
          EOF

      - name: Streak tile
        run: |
          STREAK=0
          for i in $(seq 0 30); do
            DAY=$(date -u -d "$i day ago" +%Y-%m-%d)
            COUNT=$(git log --since="$DAY 00:00" --until="$DAY 23:59" --pretty=oneline | wc -l)
            if [ "$COUNT" -gt 0 ]; then STREAK=$((STREAK+1)); else break; fi
          done
          cat > tiles/streak.svg << EOF
          <svg xmlns="http://www.w3.org/2000/svg" width="300" height="120"
               style="font-family:'Segoe UI','Segoe UI Variable',sans-serif">
            <rect width="300" height="120" fill="#106EBE"/>
            <text x="20" y="40" fill="white" font-size="20">CONTRIBUTION STREAK</text>
            <text x="20" y="80" fill="white" font-size="26">$STREAK days</text>
            <circle cx="260" cy="60" r="10" fill="white" opacity="0.7">
              <animate attributeName="r" from="6" to="12" dur="1.5s" repeatCount="indefinite"/>
              <animate attributeName="opacity" values="0.3;0.9;0.3" dur="1.5s" repeatCount="indefinite"/>
            </circle>
          </svg>
          EOF

      # =========================
      # PERSONAL & FOCUS TILES
      # =========================

      - name: Learning tile
        run: |
          cat > tiles/learning.svg << 'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="300" height="120"
               style="font-family:'Segoe UI','Segoe UI Variable',sans-serif">
            <rect width="300" height="120" fill="#005A9E"/>
            <text x="20" y="40" fill="white" font-size="20">LEARNING FOCUS</text>
            <text x="20" y="80" fill="white" font-size="16">Azure Maps • .NET • Cognitive AI</text>
          </svg>
          EOF

      - name: Energy tile
        run: |
          ENERGY=$(( ( RANDOM % 5 )  + 1 ))
          ICONS=$(printf "%0.s⚡" $(seq 1 $ENERGY))
          cat > tiles/energy.svg << EOF
          <svg xmlns="http://www.w3.org/2000/svg" width="300" height="120"
               style="font-family:'Segoe UI','Segoe UI Variable',sans-serif">
            <rect width="300" height="120" fill="#008272"/>
            <text x="20" y="40" fill="white" font-size="20">ENERGY LEVEL</text>
            <text x="20" y="80" fill="white" font-size="26">$ICONS</text>
          </svg>
          EOF

      - name: Status tile
        run: |
          cat > tiles/status.svg << 'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="300" height="140"
               xmlns:xlink="http://www.w3.org/1999/xlink"
               style="font-family:'Segoe UI','Segoe UI Variable',sans-serif">

            <rect width="300" height="140" fill="#4C4A72"/>
            <text x="20" y="35" fill="white" font-size="18">STATUS</text>

            <text id="s1" x="20" y="80" fill="white" font-size="16" opacity="1">Clarity is my form of care.</text>
            <text id="s2" x="20" y="80" fill="white" font-size="16" opacity="0">Building resilient labs &amp; systems.</text>
            <text id="s3" x="20" y="80" fill="white" font-size="16" opacity="0">AI for education, health &amp; law.</text>

            <animate xlink:href="#s1" attributeName="opacity"
                     values="1;1;0;0" keyTimes="0;0.33;0.42;1"
                     dur="12s" repeatCount="indefinite"/>
            <animate xlink:href="#s2" attributeName="opacity"
                     values="0;0;1;1;0;0" keyTimes="0;0.33;0.42;0.66;0.75;1"
                     dur="12s" repeatCount="indefinite"/>
            <animate xlink:href="#s3" attributeName="opacity"
                     values="0;0;0;0;1;1;0" keyTimes="0;0.66;0.75;0.83;0.92;1"
                     dur="12s" repeatCount="indefinite"/>

          </svg>
          EOF

      - name: Rotating text tile
        run: |
          cat > tiles/rotateText.svg << 'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="300" height="140"
               xmlns:xlink="http://www.w3.org/1999/xlink"
               style="font-family:'Segoe UI','Segoe UI Variable',sans-serif">

            <rect width="300" height="140" fill="#4C4A72"/>
            <text x="20" y="35" fill="white" font-size="18">THOUGHTS</text>

            <text id="r1" x="20" y="80" fill="white" font-size="16" opacity="1">Designing resilient systems.</text>
            <text id="r2" x="20" y="80" fill="white" font-size="16" opacity="0">Cognitive AI for real people.</text>
            <text id="r3" x="20" y="80" fill="white" font-size="16" opacity="0">Maps, mobility &amp; intelligence.</text>

            <animate xlink:href="#r1" attributeName="opacity"
                     values="1;1;0;0" keyTimes="0;0.30;0.40;1"
                     dur="12s" repeatCount="indefinite"/>
            <animate xlink:href="#r2" attributeName="opacity"
                     values="0;0;1;1;0;0" keyTimes="0;0.30;0.40;0.65;0.75;1"
                     dur="12s" repeatCount="indefinite"/>
            <animate xlink:href="#r3" attributeName="opacity"
                     values="0;0;0;0;1;1;0" keyTimes="0;0.65;0.75;0.90;1;1"
                     dur="12s" repeatCount="indefinite"/>

          </svg>
          EOF
          
      - name: Languages tile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          USER="JaswantVathanam"

          REPOS_JSON=$(curl -s \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/users/$USER/repos?per_page=100&type=owner")

          # Aggregate language bytes across repos (SUM per language key)
          LANGS=$(
            echo "$REPOS_JSON" | jq -r '.[].name' | while read -r REPO; do
              [ -z "$REPO" ] && continue
              curl -s \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                "https://api.github.com/repos/$USER/$REPO/languages"
            done | jq -s '
              reduce .[] as $obj ({};
                reduce ($obj | to_entries[]) as $e (.;
                  .[$e.key] = ((.[$e.key] // 0) + $e.value)
                )
              )
              | to_entries
              | sort_by(-.value)
              | .[]
              | .key
            ' | sed '/^$/d' | grep -Ev '^(CSS|HTML)$'
          )

          # If C# exists, also show .NET tag
          if echo "$LANGS" | grep -qx "C#"; then
            LANGS=$(printf ".NET\n%s\n" "$LANGS")
          fi

          # Fallback
          if [ -z "$LANGS" ]; then
            LANGS="None"
          fi

          TOTAL=$(echo "$LANGS" | sed '/^$/d' | wc -l | tr -d ' ')
          [ "$TOTAL" -lt 1 ] && TOTAL=1

          CYCLE=15

          {
            echo '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="140" style="font-family:'\''Segoe UI'\'','\''Segoe UI Variable'\'',sans-serif">'
            echo '  <rect width="300" height="140" fill="#5C2D91"/>'
            echo '  <text x="20" y="35" fill="white" font-size="18">TOP LANGUAGES</text>'
          } > tiles/languages.svg

          INDEX=0
          while IFS= read -r LANG; do
            [ -z "$LANG" ] && continue
            INDEX=$((INDEX+1))
            ESC_LANG=$(printf '%s' "$LANG" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g')

            SLOT_START=$(awk "BEGIN { printf \"%.6f\", ($INDEX-1)/$TOTAL }")
            SLOT_END=$(awk "BEGIN { printf \"%.6f\", $INDEX/$TOTAL }")
            SLOT_LEN=$(awk "BEGIN { printf \"%.6f\", 1/$TOTAL }")

            FADE_IN_END=$(awk "BEGIN { printf \"%.6f\", $SLOT_START + ($SLOT_LEN*0.15) }")
            HOLD_END=$(awk "BEGIN { printf \"%.6f\", $SLOT_START + ($SLOT_LEN*0.85) }")

            cat >> tiles/languages.svg << EOF
            <text x="20" y="90" fill="white" font-size="24" opacity="0">$ESC_LANG
              <animate attributeName="opacity"
                       values="0;0;1;1;0;0"
                       keyTimes="0;${SLOT_START};${FADE_IN_END};${HOLD_END};${SLOT_END};1"
                       dur="${CYCLE}s"
                       repeatCount="indefinite"/>
            </text>
          EOF
          done <<< "$LANGS"

          echo '</svg>' >> tiles/languages.svg
          
      - name: Social tile
        run: |
          cat > tiles/social.svg << 'EOF'
          <svg xmlns="http://www.w3.org/2000/svg"
               xmlns:xlink="http://www.w3.org/1999/xlink"
               width="300" height="140"
               style="font-family:'Segoe UI','Segoe UI Variable',sans-serif">

            <rect width="300" height="140" fill="#1F1F1F"/>
            <text x="20" y="30" fill="white" font-size="18">SOCIAL</text>

            <!-- FACEBOOK -->
            <a xlink:href="https://facebook.com/jaswantvathanam" target="_blank">
              <g transform="translate(20,50)">
                <!-- FB ICON -->
                <rect width="40" height="40" rx="8" fill="#1877F2"/>
                <text x="20" y="27" fill="white" font-size="28" text-anchor="middle" font-weight="bold">f</text>

                <!-- TEXT -->
                <text x="60" y="20" fill="white" font-size="18">Facebook</text>
                <text x="60" y="38" fill="white" font-size="14">@jaswantvathanam</text>
              </g>
            </a>

            <!-- INSTAGRAM -->
            <a xlink:href="https://instagram.com/jaswantvathanam" target="_blank">
              <g transform="translate(20,100)">
                <!-- IG ICON -->
                <rect width="40" height="40" rx="8" fill="#E4405F"/>
                <circle cx="20" cy="20" r="10" fill="none" stroke="white" stroke-width="3"/>
                <circle cx="28" cy="12" r="3" fill="white"/>

                <!-- TEXT -->
                <text x="60" y="20" fill="white" font-size="18">Instagram</text>
                <text x="60" y="38" fill="white" font-size="14">@jaswantvathanam</text>
              </g>
            </a>

          </svg>
          EOF

      # =========================
      # TIME & CONTEXT TILES
      # =========================

      - name: Calendar tile
        run: |
          export TZ="Asia/Kolkata"
          DAY=$(date +'%a')
          DATE=$(date +'%d')
          MONTH=$(date +'%b %Y')
          TZSTR="(+5:30 GMT)"
          cat > tiles/calendar.svg << EOF
          <svg xmlns="http://www.w3.org/2000/svg" width="300" height="140"
               style="font-family:'Segoe UI','Segoe UI Variable',sans-serif">
            <rect width="300" height="140" fill="#C239B3"/>

            <text x="20" y="40" fill="white" font-size="18">$DAY</text>
            <text x="20" y="85" fill="white" font-size="48">$DATE</text>
            <text x="90" y="85" fill="white" font-size="18">$MONTH</text>

            <text x="280" y="130" fill="#E0E0E0" font-size="12" text-anchor="end">$TZSTR</text>

            <animate attributeName="opacity" values="1;0.8;1" dur="3s" repeatCount="indefinite"/>
          </svg>
          EOF

      - name: Weather tile
        run: |
          LAT=9.37
          LON=78.83
          WEATHER=$(curl -s "https://api.open-meteo.com/v1/forecast?latitude=$LAT&longitude=$LON&current_weather=true")
          TEMP=$(echo "$WEATHER" | jq -r '.current_weather.temperature')
          WIND=$(echo "$WEATHER" | jq -r '.current_weather.windspeed')
          CODE=$(echo "$WEATHER" | jq -r '.current_weather.weathercode')
          ISDAY=$(echo "$WEATHER" | jq -r '.current_weather.is_day')

          case $CODE in
            0) COND="Clear" ;;
            1|2|3) COND="Partly Cloudy" ;;
            45|48) COND="Fog" ;;
            51|53|55) COND="Drizzle" ;;
            61|63|65) COND="Rain" ;;
            71|73|75) COND="Snow" ;;
            95) COND="Thunderstorm" ;;
            *) COND="Cloudy" ;;
          esac

          if [ "$ISDAY" -eq 1 ]; then ICON_COLOR="#B0B0B0"; else ICON_COLOR="#808080"; fi

          cat > tiles/weather.svg << EOF
          <svg xmlns="http://www.w3.org/2000/svg" width="300" height="140"
               style="font-family:'Segoe UI','Segoe UI Variable',sans-serif">
            <rect width="300" height="140" fill="#0078D4"/>

            <text x="20" y="35" fill="white" font-size="18">Ramanathapuram</text>
            <text x="20" y="80" fill="white" font-size="40">${TEMP}°C</text>
            <text x="20" y="110" fill="white" font-size="16">$COND • ${WIND} km/h</text>

            <circle cx="240" cy="60" r="18" fill="$ICON_COLOR">
              <animate attributeName="r" from="14" to="18" dur="3s" repeatCount="indefinite"/>
              <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
            </circle>
          </svg>
          EOF
          
      - name: Sunrise/Sunset tile
        run: |
          LAT=9.37
          LON=78.83
          DATA=$(curl -s "https://api.open-meteo.com/v1/forecast?latitude=$LAT&longitude=$LON&daily=sunrise,sunset&timezone=Asia/Kolkata")

          SUNRISE=$(echo "$DATA" | jq -r '.daily.sunrise[0]' | cut -d'T' -f2)
          SUNSET=$(echo "$DATA" | jq -r '.daily.sunset[0]' | cut -d'T' -f2)

          SR12=$(date -d "$SUNRISE" +"%I:%M %p")
          SS12=$(date -d "$SUNSET" +"%I:%M %p")

          cat > tiles/sun.svg << EOF
          <svg xmlns="http://www.w3.org/2000/svg" width="300" height="140"
               style="font-family:'Segoe UI','Segoe UI Variable',sans-serif">

            <rect width="300" height="140" fill="#F7630C"/>

            <text x="20" y="35" fill="white" font-size="18">SUNRISE / SUNSET</text>

            <text x="20" y="80" fill="white" font-size="20">Sunrise: $SR12</text>
            <text x="20" y="115" fill="white" font-size="20">Sunset: $SS12</text>

            <circle cx="240" cy="70" r="18" fill="#FFD700" opacity="0.9">
              <animate attributeName="cy" values="70;40;70" dur="4s" repeatCount="indefinite"/>
              <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
            </circle>

          </svg>
          EOF

      # =========================
      # SLIDE TILE
      # =========================
      - name: Slide tile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPOS=$(curl -s \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/search/repositories?q=user:JaswantVathanam&per_page=100" \
            | jq -r '.items[].name' | sed '/^$/d')

          if [ -z "$REPOS" ]; then
            REPOS="No repositories found"
          fi

          TOTAL=$(echo "$REPOS" | wc -l | tr -d ' ')
          [ "$TOTAL" -lt 1 ] && TOTAL=1

          CYCLE=20   # total loop duration (seconds)

          {
            echo '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="140" style="font-family:'\''Segoe UI'\'','\''Segoe UI Variable'\'',sans-serif">'
            echo '  <rect width="300" height="140" fill="#0078D4"/>'
            echo '  <text x="20" y="35" fill="white" font-size="18">PROJECTS</text>'
          } > tiles/slide.svg

          INDEX=0
          while IFS= read -r NAME; do
            [ -z "$NAME" ] && continue
            INDEX=$((INDEX+1))
            ESC_NAME=$(printf '%s' "$NAME" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g')

            # slot boundaries in normalized [0..1] timeline
            SLOT_START=$(awk "BEGIN { printf \"%.6f\", ($INDEX-1)/$TOTAL }")
            SLOT_END=$(awk "BEGIN { printf \"%.6f\", $INDEX/$TOTAL }")
            SLOT_LEN=$(awk "BEGIN { printf \"%.6f\", 1/$TOTAL }")

            # fade in/out portions within each slot
            FADE_IN_END=$(awk "BEGIN { printf \"%.6f\", $SLOT_START + ($SLOT_LEN*0.15) }")
            HOLD_END=$(awk "BEGIN { printf \"%.6f\", $SLOT_START + ($SLOT_LEN*0.85) }")

            cat >> tiles/slide.svg << EOF
            <text x="20" y="85" fill="white" font-size="18" opacity="0">$ESC_NAME
              <animate attributeName="opacity"
                       values="0;0;1;1;0;0"
                       keyTimes="0;${SLOT_START};${FADE_IN_END};${HOLD_END};${SLOT_END};1"
                       dur="${CYCLE}s"
                       repeatCount="indefinite"/>
            </text>
          EOF
          done <<< "$REPOS"

          echo '</svg>' >> tiles/slide.svg
      # =========================
      # SPOTIFY TILES (REAL API)
      # =========================

      - name: Spotify Now Playing
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: |
          node scripts/spotify-now-playing.js

      - name: Spotify Recently Played
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: |
          node scripts/spotify-recently-played.js

      # =========================
      # CONTRIBUTIONS TILE
      # =========================
      - name: Contributions 7d grid tile
        run: |
          # Get last 7 days (0 = today, 6 = 6 days ago)
          DAYS=()
          COUNTS=()
          for i in $(seq 6 -1 0); do
            D=$(date -d "$i days ago" +%Y-%m-%d)
            C=$(git log --since="$D 00:00" --until="$D 23:59" --pretty=oneline | wc -l)
            DAYS+=("$D")
            COUNTS+=("$C")
          done

          # Map count -> color
          get_color() {
            local c=$1
            if   [ "$c" -eq 0 ]; then echo "#1B1B1B"
            elif [ "$c" -le 2 ]; then echo "#A5D6A7"
            elif [ "$c" -le 5 ]; then echo "#66BB6A"
            elif [ "$c" -le 10 ]; then echo "#43A047"
            else                     echo "#2E7D32"
            fi
          }

          cat > tiles/contrib-7d.svg << EOF
          <svg xmlns="http://www.w3.org/2000/svg" width="300" height="140"
               style="font-family:'Segoe UI','Segoe UI Variable',sans-serif">
            <rect width="300" height="140" fill="#0078D4"/>
            <text x="20" y="30" fill="white" font-size="18">LAST 7 DAYS</text>
          EOF

          X=20
          for i in $(seq 0 6); do
            C=${COUNTS[$i]}
            COLOR=$(get_color "$C")
            echo "  <rect x=\"$X\" y=\"60\" width=\"24\" height=\"24\" rx=\"4\" fill=\"$COLOR\"/>" >> tiles/contrib-7d.svg
            X=$((X+30))
          done

          echo "</svg>" >> tiles/contrib-7d.svg
          
      - name: Contributions 30d grid tile
        run: |
          git fetch --unshallow || true

          COUNTS=()
          for i in $(seq 29 -1 0); do
            D=$(date -d "$i days ago" +%Y-%m-%d)
            C=$(git log --since="$D 00:00" --until="$D 23:59" --pretty=oneline | wc -l)
            COUNTS+=("$C")
          done

          get_color() {
            local c=$1
            if   [ "$c" -eq 0 ]; then echo "#0F2A0F"
            elif [ "$c" -le 2 ]; then echo "#4CAF50"
            elif [ "$c" -le 5 ]; then echo "#66BB6A"
            elif [ "$c" -le 10 ]; then echo "#43A047"
            else                     echo "#2E7D32"
            fi
          }

          cat > tiles/contrib-30d.svg << EOF
          <svg xmlns="http://www.w3.org/2000/svg" width="300" height="140"
               style="font-family:'Segoe UI','Segoe UI Variable',sans-serif">
            <rect width="300" height="140" fill="#0078D4"/>
            <text x="20" y="30" fill="white" font-size="18">LAST 30 DAYS</text>
          EOF

          IDX=0
          Y=50
          for row in $(seq 0 5); do   # <-- 6 ROWS
            X=20
            for col in $(seq 0 4); do # <-- 5 COLUMNS
              C=${COUNTS[$IDX]}
              COLOR=$(get_color "$C")
              echo "  <rect x=\"$X\" y=\"$Y\" width=\"20\" height=\"20\" rx=\"4\" fill=\"$COLOR\"/>" >> tiles/contrib-30d.svg
              IDX=$((IDX+1))
              X=$((X+25))
            done
            Y=$((Y+25))
          done

          echo "</svg>" >> tiles/contrib-30d.svg

      - name: Contributions line graph tile
        run: |
          DAYS=()
          COUNTS=()
          for i in $(seq 6 -1 0); do
            D=$(date -d "$i days ago" +%Y-%m-%d)
            C=$(git log --since="$D 00:00" --until="$D 23:59" --pretty=oneline | wc -l)
            DAYS+=("$D")
            COUNTS+=("$C")
          done

          # Find max
          MAX=0
          for c in "${COUNTS[@]}"; do
            [ "$c" -gt "$MAX" ] && MAX=$c
          done
          [ "$MAX" -eq 0 ] && MAX=1

          # Build polyline points (x from 40..260, y from 100..40)
          POINTS=""
          X=40
          STEP=$(( (260-40)/6 ))
          for c in "${COUNTS[@]}"; do
            # scale: higher count -> lower y
            Y=$((100 - (c * 60 / MAX)))
            POINTS="$POINTS $X,$Y"
            X=$((X+STEP))
          done

          cat > tiles/contrib-line.svg << EOF
          <svg xmlns="http://www.w3.org/2000/svg" width="300" height="140"
               style="font-family:'Segoe UI','Segoe UI Variable',sans-serif">
            <rect width="300" height="140" fill="#0078D4"/>
            <text x="20" y="25" fill="white" font-size="16">CONTRIBUTIONS (LAST 7 DAYS)</text>

            <!-- Axes -->
            <line x1="40" y1="100" x2="260" y2="100" stroke="white" stroke-width="2"/>
            <line x1="40" y1="40"  x2="40"  y2="100" stroke="white" stroke-width="2"/>

            <!-- Line -->
            <polyline fill="none" stroke="white" stroke-width="2"
                      points="$POINTS"/>
          </svg>
          EOF

      # =========================
      # GITHUB INSIGHTS TILE
      # =========================

      - name: GitHub Insights Tile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/github-insights.js


      # =========================
      # COMMIT ALL TILES
      # =========================
      - name: Commit tiles
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add tiles/*.svg tiles/*.png
          git commit -m "Updated live tiles" || { echo "No changes"; exit 0; }

          # sync with remote to avoid non-fast-forward push failure
          git fetch origin main
          git rebase origin/main || { echo "Rebase conflict, skipping push"; git rebase --abort; exit 0; }

          git push origin HEAD:main
