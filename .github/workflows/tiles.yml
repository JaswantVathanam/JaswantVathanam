name: Update Live Tiles

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Generate Commits Tile
        run: |
          mkdir -p tiles
          COMMITS=$(git log --since="7 days ago" --pretty=oneline | wc -l)
          BAR=$(printf "%0.s█" $(seq 1 $((COMMITS>0 ? (COMMITS/5+1) : 1))))
          cat << 'EOF' > tiles/commits.svg
          <svg xmlns="http://www.w3.org/2000/svg" width="300" height="120">
            <rect width="300" height="120" fill="#0078D4"/>
            <text x="20" y="40" fill="white" font-size="20">COMMITS (WEEK)</text>
            <text x="20" y="80" fill="white" font-size="26">BAR_PLACEHOLDER COMMITS_PLACEHOLDER</text>
          </svg>
          EOF
          sed -i "s/BAR_PLACEHOLDER/$BAR/" tiles/commits.svg
          sed -i "s/COMMITS_PLACEHOLDER/$COMMITS/" tiles/commits.svg

      - name: Generate Projects Tile
        run: |
          mkdir -p tiles
          PROJECTS=$(find . -maxdepth 1 -type d | wc -l)
          BAR=$(printf "%0.s█" $(seq 1 $((PROJECTS>0 ? PROJECTS : 1))))
          cat << 'EOF' > tiles/projects.svg
          <svg xmlns="http://www.w3.org/2000/svg" width="300" height="120">
            <rect width="300" height="120" fill="#00B7C3"/>
            <text x="20" y="40" fill="white" font-size="20">PROJECTS ACTIVE</text>
            <text x="20" y="80" fill="white" font-size="26">BAR_PLACEHOLDER PROJECTS_PLACEHOLDER</text>
          </svg>
          EOF
          sed -i "s/BAR_PLACEHOLDER/$BAR/" tiles/projects.svg
          sed -i "s/PROJECTS_PLACEHOLDER/$PROJECTS/" tiles/projects.svg

      - name: Generate Learning Tile
        run: |
          mkdir -p tiles
          cat << 'EOF' > tiles/learning.svg
          <svg xmlns="http://www.w3.org/2000/svg" width="300" height="120">
            <rect width="300" height="120" fill="#005A9E"/>
            <text x="20" y="40" fill="white" font-size="20">LEARNING FOCUS</text>
            <text x="20" y="80" fill="white" font-size="16">Azure Maps • .NET • Cognitive AI</text>
          </svg>
          EOF

      - name: Generate Energy Tile
        run: |
          mkdir -p tiles
          ENERGY=$(( ( RANDOM % 5 )  + 1 ))
          ICONS=$(printf "%0.s⚡" $(seq 1 $ENERGY))
          cat << 'EOF' > tiles/energy.svg
          <svg xmlns="http://www.w3.org/2000/svg" width="300" height="120">
            <rect width="300" height="120" fill="#008272"/>
            <text x="20" y="40" fill="white" font-size="20">ENERGY LEVEL</text>
            <text x="20" y="80" fill="white" font-size="26">ICONS_PLACEHOLDER</text>
          </svg>
          EOF
          sed -i "s/ICONS_PLACEHOLDER/$ICONS/" tiles/energy.svg

      - name: Commit tiles
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add tiles/*.svg
          git commit -m "Updated live tiles" || echo "No changes"
          git push
