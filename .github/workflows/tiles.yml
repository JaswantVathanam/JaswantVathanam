name: Update Live Tiles

on:
  schedule:
    - cron: "*/5 * * * *"     # every 5 minutes (activity tiles)
    - cron: "0 * * * *"       # hourly (weather)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Ensure tiles folder
        run: mkdir -p tiles

      # =========================
      # SYSTEM & ACTIVITY TILES
      # =========================

      # COMMITS (WEEK)
      - name: Commits tile
        run: |
          COMMITS=$(git log --since="7 days ago" --pretty=oneline | wc -l)
          BAR=$(printf "%0.s█" $(seq 1 $((COMMITS>0 ? (COMMITS/5+1) : 1))))
          cat > tiles/commits.svg << EOF
          <svg xmlns="http://www.w3.org/2000/svg"
               width="300" height="120"
               style="font-family:'Segoe UI','Segoe UI Variable',sans-serif">
            <rect width="300" height="120" fill="#0078D4"/>
            <text x="20" y="40" fill="white" font-size="20">COMMITS (WEEK)</text>
            <text x="20" y="80" fill="white" font-size="26">$BAR $COMMITS</text>
          </svg>
          EOF

      # PROJECTS ACTIVE
      - name: Projects tile
        run: |
          PROJECTS=$(find . -maxdepth 1 -type d | wc -l)
          BAR=$(printf "%0.s█" $(seq 1 $((PROJECTS>0 ? PROJECTS : 1))))
          cat > tiles/projects.svg << EOF
          <svg xmlns="http://www.w3.org/2000/svg"
               width="300" height="120"
               style="font-family:'Segoe UI','Segoe UI Variable',sans-serif">
            <rect width="300" height="120" fill="#00B7C3"/>
            <text x="20" y="40" fill="white" font-size="20">PROJECTS ACTIVE</text>
            <text x="20" y="80" fill="white" font-size="26">$BAR $PROJECTS</text>
          </svg>
          EOF

      # LINES OF CODE ADDED / REMOVED (LAST 7 DAYS) — NO BARS
      - name: LOC tile
        run: |
          STATS=$(git log --since="7 days ago" --numstat --pretty="%H" | awk 'NF==3 {add+=$1; del+=$2} END {print add,del}')
          ADDED=$(echo "$STATS" | awk '{print $1+0}')
          REMOVED=$(echo "$STATS" | awk '{print $2+0}')
          cat > tiles/loc.svg << EOF
          <svg xmlns="http://www.w3.org/2000/svg"
               width="300" height="140"
               style="font-family:'Segoe UI','Segoe UI Variable',sans-serif">
            <rect width="300" height="140" fill="#2B88D8"/>
            <g opacity="0">
              <text x="20" y="35" fill="white" font-size="18">LINES OF CODE (7 DAYS)</text>
              <text x="20" y="70" fill="white" font-size="16">+ $ADDED added</text>
              <text x="20" y="100" fill="white" font-size="16">- $REMOVED removed</text>
              <animate attributeName="opacity"
                       from="0" to="1"
                       dur="1.2s"
                       repeatCount="1"
                       fill="freeze" />
            </g>
          </svg>
          EOF

      # CONTRIBUTION STREAK (APPROX)
      - name: Streak tile
        run: |
          STREAK=0
          for i in $(seq 0 30); do
            DAY=$(date -u -d "$i day ago" +%Y-%m-%d)
            COUNT=$(git log --since="$DAY 00:00" --until="$DAY 23:59" --pretty=oneline | wc -l)
            if [ "$COUNT" -gt 0 ]; then
              STREAK=$((STREAK+1))
            else
              break
            fi
          done
          cat > tiles/streak.svg << EOF
          <svg xmlns="http://www.w3.org/2000/svg"
               width="300" height="120"
               style="font-family:'Segoe UI','Segoe UI Variable',sans-serif">
            <rect width="300" height="120" fill="#106EBE"/>
            <text x="20" y="40" fill="white" font-size="20">CONTRIBUTION STREAK</text>
            <text x="20" y="80" fill="white" font-size="26">$STREAK days</text>
            <circle cx="260" cy="60" r="10" fill="#FFFFFF" opacity="0.7">
              <animate attributeName="r" from="6" to="12" dur="1.5s" repeatCount="indefinite" />
              <animate attributeName="opacity" from="0.3" to="0.9" dur="1.5s" repeatCount="indefinite" />
            </circle>
          </svg>
          EOF

      # =========================
      # PERSONAL & FOCUS TILES
      # =========================

      # LEARNING FOCUS
      - name: Learning tile
        run: |
          cat > tiles/learning.svg << 'EOF'
          <svg xmlns="http://www.w3.org/2000/svg"
               width="300" height="120"
               style="font-family:'Segoe UI','Segoe UI Variable',sans-serif">
            <rect width="300" height="120" fill="#005A9E"/>
            <text x="20" y="40" fill="white" font-size="20">LEARNING FOCUS</text>
            <text x="20" y="80" fill="white" font-size="16">Azure Maps • .NET • Cognitive AI</text>
          </svg>
          EOF

      # ENERGY LEVEL
      - name: Energy tile
        run: |
          ENERGY=$(( ( RANDOM % 5 )  + 1 ))
          ICONS=$(printf "%0.s⚡" $(seq 1 $ENERGY))
          cat > tiles/energy.svg << EOF
          <svg xmlns="http://www.w3.org/2000/svg"
               width="300" height="120"
               style="font-family:'Segoe UI','Segoe UI Variable',sans-serif">
            <rect width="300" height="120" fill="#008272"/>
            <text x="20" y="40" fill="white" font-size="20">ENERGY LEVEL</text>
            <text x="20" y="80" fill="white" font-size="26">$ICONS</text>
          </svg>
          EOF

      # STATUS / ROTATING TEXT TILE — SLOWER, TILE ROTATION
      - name: Status tile
        run: |
          cat > tiles/rotateText.svg << 'EOF'
          <svg xmlns="http://www.w3.org/2000/svg"
               xmlns:xlink="http://www.w3.org/1999/xlink"
               width="300" height="140"
               style="font-family:'Segoe UI','Segoe UI Variable',sans-serif">
            <g id="tile" transform="translate(0,0)">
              <rect width="300" height="140" fill="#4C4A72"/>
              <text x="20" y="35" fill="white" font-size="18">STATUS</text>

              <text id="t1" x="20" y="80" fill="white" font-size="16" opacity="1">
                Clarity is my form of care.
              </text>
              <text id="t2" x="20" y="80" fill="white" font-size="16" opacity="0">
                Building resilient labs &amp; systems.
              </text>
              <text id="t3" x="20" y="80" fill="white" font-size="16" opacity="0">
                AI for education, health &amp; law.
              </text>
            </g>

            <!-- Text fades with time to read -->
            <animate xlink:href="#t1"
                     attributeName="opacity"
                     values="1;1;0;0"
                     keyTimes="0;0.4;0.5;1"
                     dur="12s"
                     repeatCount="indefinite" />
            <animate xlink:href="#t2"
                     attributeName="opacity"
                     values="0;0;1;1;0;0"
                     keyTimes="0;0.4;0.5;0.9;1;1"
                     dur="12s"
                     repeatCount="indefinite" />
            <animate xlink:href="#t3"
                     attributeName="opacity"
                     values="0;0;0;1;1;0"
                     keyTimes="0;0.7;0.8;0.9;1;1"
                     dur="12s"
                     repeatCount="indefinite" />

            <!-- Whole tile slow rotation with pause -->
            <animateTransform xlink:href="#tile"
                              attributeName="transform"
                              type="rotate"
                              values="0 150 70; 360 150 70; 360 150 70"
                              keyTimes="0;0.8;1"
                              dur="12s"
                              repeatCount="indefinite" />
          </svg>
          EOF

      # =========================
      # TIME & CONTEXT TILES
      # =========================

      # CALENDAR TILE (+5:30 GMT at bottom)
      - name: Calendar tile
        run: |
          DAY=$(date +'%a')
          DATE=$(date +'%d')
          MONTH=$(date +'%b %Y')
          TZSTR="(+5:30 GMT)"
          cat > tiles/calendar.svg << EOF
          <svg xmlns="http://www.w3.org/2000/svg"
               xmlns:xlink="http://www.w3.org/1999/xlink"
               width="300" height="140"
               style="font-family:'Segoe UI','Segoe UI Variable',sans-serif">
            <rect width="300" height="140" fill="#C239B3"/>

            <text x="20" y="40" fill="white" font-size="18">$DAY</text>
            <text x="20" y="85" fill="white" font-size="48">$DATE</text>
            <text x="90" y="85" fill="white" font-size="18">$MONTH</text>

            <text x="280" y="130" fill="#E0E0E0" font-size="12" text-anchor="end">$TZSTR</text>

            <animate attributeName="opacity"
                     values="1;0.8;1"
                     dur="3s"
                     repeatCount="indefinite" />
          </svg>
          EOF

      # LIVE WEATHER TILE (RAMANATHAPURAM, DAY/NIGHT ICON)
      - name: Weather tile
        run: |
          LAT=9.37
          LON=78.83
          WEATHER=$(curl -s "https://api.open-meteo.com/v1/forecast?latitude=$LAT&longitude=$LON&current_weather=true")
          TEMP=$(echo "$WEATHER" | jq -r '.current_weather.temperature')
          WIND=$(echo "$WEATHER" | jq -r '.current_weather.windspeed')
          CODE=$(echo "$WEATHER" | jq -r '.current_weather.weathercode')
          ISDAY=$(echo "$WEATHER" | jq -r '.current_weather.is_day')

          case $CODE in
            0) COND="Clear" ;;
            1|2|3) COND="Partly Cloudy" ;;
            45|48) COND="Fog" ;;
            51|53|55) COND="Drizzle" ;;
            61|63|65) COND="Rain" ;;
            71|73|75) COND="Snow" ;;
            95) COND="Thunderstorm" ;;
            *) COND="Cloudy" ;;
          esac

          if [ "$ISDAY" -eq 1 ]; then
            ICON_COLOR="#B0B0B0"   # light gray (partly cloudy style)
          else
            ICON_COLOR="#808080"   # darker gray for night
          fi

          cat > tiles/weather.svg << EOF
          <svg xmlns="http://www.w3.org/2000/svg"
               xmlns:xlink="http://www.w3.org/1999/xlink"
               width="300" height="140"
               style="font-family:'Segoe UI','Segoe UI Variable',sans-serif">
            <rect width="300" height="140" fill="#0078D4"/>

            <text x="20" y="35" fill="white" font-size="18">Ramanathapuram</text>
            <text x="20" y="80" fill="white" font-size="40">${TEMP}°C</text>
            <text x="20" y="110" fill="white" font-size="16">$COND • ${WIND} km/h</text>

            <circle cx="240" cy="60" r="18" fill="$ICON_COLOR">
              <animate attributeName="r"
                       from="14" to="18"
                       dur="3s"
                       repeatCount="indefinite" />
              <animate attributeName="opacity"
                       values="0.7;1;0.7"
                       dur="3s"
                       repeatCount="indefinite" />
            </circle>
          </svg>
          EOF

      # =========================
      # MOTION & ANIMATION TILES
      # =========================

      # FLIP TILE (simple text flip)
      - name: Flip tile
        run: |
          cat > tiles/flip.svg << 'EOF'
          <svg xmlns="http://www.w3.org/2000/svg"
               xmlns:xlink="http://www.w3.org/1999/xlink"
               width="300" height="140"
               style="font-family:'Segoe UI','Segoe UI Variable',sans-serif">
            <rect width="300" height="140" fill="#2D2D30"/>
            <text id="front" x="20" y="70" fill="white" font-size="18">DEV DASHBOARD</text>
            <text id="back" x="20" y="70" fill="white" font-size="18" opacity="0">Windows 10 Live Tile</text>

            <animate xlink:href="#front"
                     attributeName="opacity"
                     values="1;0;0"
                     dur="6s"
                     repeatCount="indefinite" />
            <animate xlink:href="#back"
                     attributeName="opacity"
                     values="0;0;1"
                     dur="6s"
                     begin="3s"
                     repeatCount="indefinite" />
          </svg>
          EOF

      # SLIDE TILE — WHOLE TILE SLIDE
      - name: Slide tile
        run: |
          cat > tiles/slide.svg << 'EOF'
          <svg xmlns="http://www.w3.org/2000/svg"
               xmlns:xlink="http://www.w3.org/1999/xlink"
               width="300" height="140"
               style="font-family:'Segoe UI','Segoe UI Variable',sans-serif">
            <g id="slideTile">
              <rect width="300" height="140" fill="#0078D4"/>
              <text x="20" y="60" fill="white" font-size="18">Cognitive Rehab Platform</text>
              <text x="20" y="90" fill="white" font-size="16">AI Legal Assistant</text>
            </g>

            <!-- Whole tile subtle slide like Windows 10 -->
            <animateTransform xlink:href="#slideTile"
                              attributeName="transform"
                              type="translate"
                              values="0 0; -20 0; 0 0"
                              keyTimes="0;0.5;1"
                              dur="4s"
                              repeatCount="indefinite" />
          </svg>
          EOF

      # =========================
      # COMMIT ALL TILES
      # =========================

      - name: Commit tiles
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add tiles/*.svg
          git commit -m "Updated live tiles" || echo "No changes"
          git push
