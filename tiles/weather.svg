<svg xmlns="http://www.w3.org/2000/svg" width="300" height="140"
     style="font-family:'Segoe UI','Segoe UI Variable',sans-serif">
  <rect width="300" height="140" fill="#0078D4"/>
  <text x="20" y="35" fill="white" font-size="18">Ramanathapuram</text>
  <text x="20" y="80" fill="white" font-size="40">29.4°C</text>
  <text x="20" y="110" fill="white" font-size="16">Partly Cloudy • 2.1 km/h</text>
  <circle cx="240" cy="60" r="18" fill="#808080">
    <animate attributeName="r" from="14" to="18" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
