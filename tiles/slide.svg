<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="300" height="140"
     style="font-family:'Segoe UI','Segoe UI Variable',sans-serif">

  <rect width="300" height="140" fill="#0078D4"/>
  <text x="20" y="35" fill="white" font-size="18">PROJECTS</text>

  <text id="t1" x="20" y="80" fill="white" font-size="16" opacity="1">BuildForBharat-Project</text>
  <text id="t2" x="20" y="80" fill="white" font-size="16" opacity="0">GrowNet</text>

  <animate xlink:href="#t1" attributeName="opacity"
           values="1;1;0;0"
           keyTimes="0;0.45;0.55;1"
           dur="8s"
           repeatCount="indefinite"/>

  <animate xlink:href="#t2" attributeName="opacity"
           values="0;0;1;1;0;0"
           keyTimes="0;0.45;0.55;0.9;1;1"
           dur="8s"
           repeatCount="indefinite"/>

</svg>
