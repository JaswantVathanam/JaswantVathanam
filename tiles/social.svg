<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="300" height="140"
     style="font-family:'Segoe UI','Segoe UI Variable',sans-serif">

  <rect width="300" height="140" fill="#1F1F1F"/>

  <text x="20" y="28" fill="white" font-size="18">SOCIAL HUB</text>

  <!-- ========== LAYOUT 1 (3 circles) ========== -->
  <g id="l1" opacity="1">

    <!-- Facebook -->
    <a xlink:href="https://facebook.com/jaswantvathanam" target="_blank">
      <circle cx="50" cy="90" r="28" fill="#1877F2"/>
      <text x="50" y="98" fill="white" font-size="26" text-anchor="middle" font-weight="bold">f</text>
    </a>

    <!-- Instagram -->
    <a xlink:href="https://instagram.com/jaswantvathanam" target="_blank">
      <circle cx="130" cy="90" r="28" fill="#E4405F"/>
      <circle cx="130" cy="90" r="12" fill="none" stroke="white" stroke-width="4"/>
      <circle cx="145" cy="75" r="4" fill="white"/>
    </a>

    <!-- LinkedIn -->
    <a xlink:href="https://www.linkedin.com/in/jaswant-b-vathanam/" target="_blank">
      <circle cx="210" cy="90" r="28" fill="#0077B5"/>
      <text x="210" y="98" fill="white" font-size="20" text-anchor="middle" font-weight="bold">in</text>
    </a>

  </g>

  <!-- ========== LAYOUT 2 (Medium + Email wide) ========== -->
  <g id="l2" opacity="0">

    <!-- Medium -->
    <a xlink:href="https://medium.com/@bjaswant2005.medium.com" target="_blank">
      <rect x="20" y="50" width="120" height="70" rx="10" fill="#12100E"/>
      <text x="80" y="92" fill="white" font-size="32" text-anchor="middle" font-weight="bold">M</text>
    </a>

    <!-- Email -->
    <a xlink:href="mailto:JaswantVathanam@outlook.com" target="_blank">
      <rect x="160" y="50" width="120" height="70" rx="10" fill="#0078D4"/>
      <text x="220" y="92" fill="white" font-size="20" text-anchor="middle">Email</text>
    </a>

  </g>

  <!-- ========== LAYOUT 3 (Zoom collage) ========== -->
  <g id="l3" opacity="0">

    <!-- Big Instagram -->
    <a xlink:href="https://instagram.com/jaswantvathanam" target="_blank">
      <circle cx="70" cy="90" r="40" fill="#E4405F">
        <animate attributeName="r" values="36;40;36" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="70" cy="90" r="18" fill="none" stroke="white" stroke-width="5"/>
      <circle cx="90" cy="65" r="5" fill="white"/>
    </a>

    <!-- Small Facebook -->
    <a xlink:href="https://facebook.com/jaswantvathanam" target="_blank">
      <circle cx="160" cy="70" r="22" fill="#1877F2"/>
      <text x="160" y="78" fill="white" font-size="20" text-anchor="middle" font-weight="bold">f</text>
    </a>

    <!-- Small LinkedIn -->
    <a xlink:href="https://www.linkedin.com/in/jaswant-b-vathanam/" target="_blank">
      <circle cx="220" cy="110" r="22" fill="#0077B5"/>
      <text x="220" y="118" fill="white" font-size="18" text-anchor="middle" font-weight="bold">in</text>
    </a>

  </g>

  <!-- ========== ANIMATIONS ========== -->
  <animate xlink:href="#l1" attributeName="opacity"
           values="1;1;0;0" keyTimes="0;0.33;0.34;1"
           dur="12s" repeatCount="indefinite"/>

  <animate xlink:href="#l2" attributeName="opacity"
           values="0;0;1;1;0;0" keyTimes="0;0.33;0.34;0.66;0.67;1"
           dur="12s" repeatCount="indefinite"/>

  <animate xlink:href="#l3" attributeName="opacity"
           values="0;0;0;0;1;1;0" keyTimes="0;0.66;0.67;0.90;0.91;1"
           dur="12s" repeatCount="indefinite"/>

</svg>
