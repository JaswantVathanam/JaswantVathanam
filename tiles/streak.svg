<svg xmlns="http://www.w3.org/2000/svg" width="300" height="120"
     style="font-family:'Segoe UI','Segoe UI Variable',sans-serif">
  <rect width="300" height="120" fill="#106EBE"/>
  <text x="20" y="40" fill="white" font-size="20">CONTRIBUTION STREAK</text>
  <text x="20" y="80" fill="white" font-size="26">23 days</text>
  <circle cx="260" cy="60" r="10" fill="white" opacity="0.7">
    <animate attributeName="r" from="6" to="12" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>
