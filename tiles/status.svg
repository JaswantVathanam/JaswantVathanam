<svg xmlns="http://www.w3.org/2000/svg" width="300" height="140"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     style="font-family:'Segoe UI','Segoe UI Variable',sans-serif">

  <rect width="300" height="140" fill="#4C4A72"/>
  <text x="20" y="35" fill="white" font-size="18">STATUS</text>

  <text id="s1" x="20" y="80" fill="white" font-size="16" opacity="1">Clarity is my form of care.</text>
  <text id="s2" x="20" y="80" fill="white" font-size="16" opacity="0">Building resilient labs &amp; systems.</text>
  <text id="s3" x="20" y="80" fill="white" font-size="16" opacity="0">AI for education, health &amp; law.</text>

  <animate xlink:href="#s1" attributeName="opacity"
           values="1;1;0;0" keyTimes="0;0.33;0.42;1"
           dur="12s" repeatCount="indefinite"/>
  <animate xlink:href="#s2" attributeName="opacity"
           values="0;0;1;1;0;0" keyTimes="0;0.33;0.42;0.66;0.75;1"
           dur="12s" repeatCount="indefinite"/>
  <animate xlink:href="#s3" attributeName="opacity"
           values="0;0;0;0;1;1;0" keyTimes="0;0.66;0.75;0.83;0.92;1"
           dur="12s" repeatCount="indefinite"/>
</svg>
